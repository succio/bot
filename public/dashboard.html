<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>replicas.live - Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --card: #ffffff;
      --accent: #111111;
      --accent-hover: #333333;
      --ink: #111111;
      --muted: #666666;
      --border: #e0e0e0;
      --green: #2a7d4f;
      --green-bg: rgba(42,125,79,0.08);
      --orange: #b57a15;
      --orange-bg: rgba(181,122,21,0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #ffffff;
      font-family: "Playfair Display", Georgia, "Times New Roman", serif;
      color: var(--ink);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--border);
      background: #ffffff;
    }

    .topbar-brand {
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }

    .topbar-brand span {
      font-size: 1.3rem;
      font-weight: 400;
      letter-spacing: 0.06em;
      color: #111;
    }

    .topbar-user {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .user-email {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .btn {
      padding: 0.5rem 1.2rem;
      border: none;
      border-radius: 2px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-hover); }

    .btn-outline {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-outline:hover {
      color: var(--ink);
      border-color: var(--ink);
    }

    .btn-enter {
      background: var(--accent);
      color: #fff;
      padding: 0.75rem 2.5rem;
      border-radius: 2px;
      font-size: 1rem;
      letter-spacing: 0.04em;
    }
    .btn-enter:hover { background: var(--accent-hover); }

    .dashboard {
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    .status-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 1.5rem 2rem;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .status-left h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
    }

    .status-label {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .status-right {
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    .stat {
      text-align: center;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent);
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .package-badge {
      display: inline-block;
      padding: 0.25rem 0.8rem;
      border-radius: 2px;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .badge-active {
      background: var(--green-bg);
      color: var(--green);
      border: 1px solid rgba(42,125,79,0.2);
    }

    .badge-none {
      background: var(--orange-bg);
      color: var(--orange);
      border: 1px solid rgba(181,122,21,0.2);
    }

    .section-title {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .packages-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.2rem;
      margin-bottom: 2.5rem;
    }

    .pkg-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 1.6rem;
      display: flex;
      flex-direction: column;
      transition: border-color 0.2s;
    }

    .pkg-card:hover {
      border-color: var(--accent);
    }

    .pkg-card.current {
      border-color: var(--green);
    }

    .pkg-name {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 0.3rem;
    }

    .pkg-price {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 0.1rem;
    }

    .pkg-price span {
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: 400;
    }

    .pkg-tokens {
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 1.2rem;
    }

    .pkg-features {
      list-style: none;
      margin-bottom: 1.4rem;
      flex: 1;
    }

    .pkg-features li {
      font-size: 0.82rem;
      color: var(--muted);
      padding: 0.3rem 0;
      padding-left: 1.2rem;
      position: relative;
    }

    .pkg-features li::before {
      content: "\2713";
      position: absolute;
      left: 0;
      color: var(--green);
      font-weight: 700;
    }

    .pkg-buy-btn {
      width: 100%;
      padding: 0.6rem;
      border: none;
      border-radius: 2px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      background: var(--accent);
      color: #fff;
      letter-spacing: 0.03em;
    }

    .pkg-buy-btn:hover { background: var(--accent-hover); }
    .pkg-buy-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .enter-section {
      text-align: center;
      padding: 2rem 0;
    }

    .loading {
      text-align: center;
      padding: 4rem;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.active { display: flex; }

    .modal {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 2rem;
      width: 90%;
      max-width: 420px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.15);
    }

    .modal h3 {
      margin-bottom: 1rem;
      font-size: 1.1rem;
    }

    .modal select {
      width: 100%;
      padding: 0.6rem;
      background: #fafafa;
      border: 1px solid var(--border);
      border-radius: 2px;
      color: var(--ink);
      font-size: 0.95rem;
      font-family: inherit;
      margin-bottom: 1rem;
    }

    .modal-actions {
      display: flex;
      gap: 0.8rem;
      justify-content: flex-end;
    }

    .pay-details {
      background: #fafafa;
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 1.2rem;
      margin-top: 1rem;
      display: none;
      word-break: break-all;
    }

    .pay-details p {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    .pay-details .pay-value {
      color: var(--ink);
      font-weight: 600;
      font-size: 1rem;
    }

    .pay-details .pay-address {
      color: var(--accent);
      font-size: 0.82rem;
      font-family: monospace;
    }

    @media (max-width: 600px) {
      .topbar { padding: 0.8rem 1rem; }
      .dashboard { padding: 1.2rem 1rem; }
      .status-card { flex-direction: column; align-items: flex-start; }
      .status-right { width: 100%; justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <a href="/" class="topbar-brand" style="text-decoration:none;">
      <span>replicas.live</span>
    </a>
    <div class="topbar-user">
      <span class="user-email" id="userEmail"></span>
      <button class="btn btn-outline" id="logoutBtn">Logout</button>
    </div>
  </div>

  <div class="dashboard">
    <div class="loading" id="loadingState">Loading your account...</div>

    <div id="dashboardContent" style="display:none;">
      <div class="status-card">
        <div class="status-left">
          <h2>Your Account</h2>
          <div class="status-label">
            Current Package:
            <span class="package-badge" id="packageBadge"></span>
          </div>
        </div>
        <div class="status-right">
          <div class="stat">
            <div class="stat-value" id="creditCount">0</div>
            <div class="stat-label">Remaining</div>
          </div>
        </div>
      </div>

      <h3 class="section-title">Packages</h3>
      <div class="packages-grid" id="packagesGrid"></div>

      <div class="enter-section">
        <div style="display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;">
          <button class="btn btn-enter" id="generateBtn" disabled style="background:#1a5c38;">Generate</button>
        </div>
        <p class="enter-hint" id="enterHint" style="color:var(--orange);font-size:0.82rem;margin-top:0.6rem;">Purchase a package to begin generating statements.</p>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="cryptoModal">
    <div class="modal">
      <h3>Select Cryptocurrency</h3>
      <p style="font-size:0.85rem;color:var(--muted);margin-bottom:1rem;" id="modalPkgInfo"></p>
      <select id="cryptoSelect">
        <option value="">Loading currencies...</option>
      </select>
      <div class="modal-actions">
        <button class="btn btn-outline" id="modalCancel">Cancel</button>
        <button class="btn btn-primary" id="modalConfirm" disabled>Pay Now</button>
      </div>
      <div class="pay-details" id="payDetails">
        <p>Send exactly:</p>
        <div class="pay-value" id="payAmount"></div>
        <p style="margin-top:0.8rem;">To this address:</p>
        <div class="pay-address" id="payAddress"></div>
        <p style="margin-top:0.8rem;color:var(--green);font-size:0.82rem;">Payment will be detected automatically. Refresh this page after sending to check your tokens.</p>
      </div>
    </div>
  </div>

  <script>
    function getToken() {
      return localStorage.getItem('token');
    }

    function getAuthHeaders() {
      const token = getToken();
      return token ? { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' } : {};
    }

    function logout() {
      localStorage.removeItem('token');
      window.location.href = '/login.html';
    }

    async function loadDashboard() {
      const token = getToken();
      if (!token) {
        window.location.href = '/login.html';
        return;
      }

      try {
        const [profileRes, packagesRes] = await Promise.all([
          fetch('/api/credits/me?_=' + Date.now(), { headers: getAuthHeaders() }),
          fetch('/api/payments/packages')
        ]);

        if (!profileRes.ok) {
          localStorage.removeItem('token');
          window.location.href = '/login.html';
          return;
        }

        const profile = await profileRes.json();
        const { packages } = await packagesRes.json();

        document.getElementById('userEmail').textContent = profile.email;
        document.getElementById('creditCount').textContent = profile.credits;

        const badge = document.getElementById('packageBadge');
        if (profile.package) {
          badge.textContent = profile.package;
          badge.className = 'package-badge badge-active';
        } else {
          badge.textContent = 'No Package';
          badge.className = 'package-badge badge-none';
        }

        const grid = document.getElementById('packagesGrid');
        grid.innerHTML = '';

        for (const [id, pkg] of Object.entries(packages)) {
          const isCurrent = profile.package && profile.package.toLowerCase() === pkg.name.toLowerCase();
          const card = document.createElement('div');
          card.className = 'pkg-card' + (isCurrent ? ' current' : '');
          const featureItems = (pkg.features || []).map(f => `<li>${f}</li>`).join('');
          card.innerHTML = `
            <div class="pkg-name">${pkg.name}${isCurrent ? ' <span class="package-badge badge-active" style="font-size:0.7rem;">Current</span>' : ''}</div>
            <div class="pkg-price">$${pkg.price} <span>USD</span></div>
            <div class="pkg-tokens">${pkg.description || ''}</div>
            <ul class="pkg-features">${featureItems}</ul>
            <button class="pkg-buy-btn" data-pkg="${id}">Purchase with Crypto</button>
          `;
          grid.appendChild(card);
        }

        grid.querySelectorAll('.pkg-buy-btn').forEach(btn => {
          btn.addEventListener('click', () => purchasePackage(btn.dataset.pkg));
        });

        const generateBtn = document.getElementById('generateBtn');
        const enterHint = document.getElementById('enterHint');
        if (profile.credits > 0) {
          generateBtn.disabled = false;
          enterHint.style.display = 'none';
        } else {
          generateBtn.disabled = true;
          enterHint.style.display = 'block';
        }

        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('dashboardContent').style.display = 'block';

      } catch (err) {
        console.error('Dashboard load error:', err);
        document.getElementById('loadingState').textContent = 'Failed to load. Please refresh.';
      }
    }

    let selectedPackageId = null;
    let currenciesLoaded = false;
    const TOP_CRYPTOS = ['btc', 'eth', 'ltc', 'usdttrc20', 'usdterc20', 'trx', 'bnbbsc', 'sol', 'xrp', 'doge', 'matic'];

    async function purchasePackage(packageId) {
      selectedPackageId = packageId;
      const modal = document.getElementById('cryptoModal');
      const select = document.getElementById('cryptoSelect');
      const confirm = document.getElementById('modalConfirm');
      const pkgInfo = document.getElementById('modalPkgInfo');
      const payDetails = document.getElementById('payDetails');

      payDetails.style.display = 'none';
      confirm.disabled = true;
      confirm.textContent = 'Pay Now';

      const pkg = Object.entries(await (await fetch('/api/payments/packages')).json())[0] ? null : null;
      pkgInfo.textContent = `Package: ${packageId.charAt(0).toUpperCase() + packageId.slice(1)}`;

      if (!currenciesLoaded) {
        try {
          const res = await fetch('/api/payments/currencies');
          const data = await res.json();
          if (data.currencies) {
            select.innerHTML = '<option value="">-- Select a cryptocurrency --</option>';
            const sorted = TOP_CRYPTOS.filter(c => data.currencies.includes(c));
            const rest = data.currencies.filter(c => !TOP_CRYPTOS.includes(c)).sort();
            [...sorted, ...rest].forEach(c => {
              const opt = document.createElement('option');
              opt.value = c;
              opt.textContent = c.toUpperCase();
              select.appendChild(opt);
            });
            currenciesLoaded = true;
          }
        } catch (err) {
          select.innerHTML = '<option value="">Failed to load currencies</option>';
        }
      }

      select.value = '';
      modal.classList.add('active');
    }

    document.getElementById('cryptoSelect').addEventListener('change', (e) => {
      document.getElementById('modalConfirm').disabled = !e.target.value;
      document.getElementById('payDetails').style.display = 'none';
    });

    document.getElementById('modalCancel').addEventListener('click', () => {
      document.getElementById('cryptoModal').classList.remove('active');
      selectedPackageId = null;
    });

    document.getElementById('modalConfirm').addEventListener('click', async () => {
      const currency = document.getElementById('cryptoSelect').value;
      const confirmBtn = document.getElementById('modalConfirm');
      if (!currency || !selectedPackageId) return;

      confirmBtn.disabled = true;
      confirmBtn.textContent = 'Creating payment...';

      try {
        const res = await fetch('/api/payments/create-payment', {
          method: 'POST',
          headers: getAuthHeaders(),
          body: JSON.stringify({ packageId: selectedPackageId, pay_currency: currency })
        });

        const data = await res.json();

        if (!res.ok) {
          alert(data.error || 'Failed to create payment.');
          confirmBtn.textContent = 'Pay Now';
          confirmBtn.disabled = false;
          return;
        }

        const payment = data.payment;
        document.getElementById('payAmount').textContent = `${payment.pay_amount} ${payment.pay_currency.toUpperCase()}`;
        document.getElementById('payAddress').textContent = payment.pay_address;
        document.getElementById('payDetails').style.display = 'block';
        confirmBtn.textContent = 'Payment Created';
      } catch (err) {
        alert('Network error. Please try again.');
        confirmBtn.textContent = 'Pay Now';
        confirmBtn.disabled = false;
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', logout);
    document.getElementById('generateBtn').addEventListener('click', () => {
      window.location.href = '/bank.html';
    });

    loadDashboard();
  </script>
</body>
</html>
